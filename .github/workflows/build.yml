name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-cache
      # In CI compiliamo solo Release: il triplet "release" evita di costruire anche le librerie Debug.
      VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@v4

      - name: Installa vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Ripristina la cache di vcpkg
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - uses: microsoft/setup-msbuild@v2

      - name: Compila (Release x64)
        shell: pwsh
        run: msbuild EditorVideo.slnx /m /nologo /p:Configuration=Release /p:Platform=x64 /p:VcpkgTriplet=$env:VCPKG_TRIPLET

      - name: Salva la cache di vcpkg
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Test
        shell: pwsh
        run: bin\x64\Release\EditorTests.exe

      - name: Avvio dell'applicazione
        shell: pwsh
        run: |
          $p = Start-Process bin\x64\Release\EditorVideo.exe -ArgumentList '--smoke-test' -PassThru `
                 -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          $null = $p.Handle  # necessario per leggere ExitCode
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "EditorVideo non si è chiuso entro 60 secondi" }
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "EditorVideo è uscito con codice $($p.ExitCode)" }

      - name: Prova della riproduzione
        shell: pwsh
        run: |
          # Genera tre file di prova da 10 secondi e li riproduce per 2 secondi ciascuno.
          # Sul server di solito non ci sono GPU né scheda audio: si verificano anche la decodifica
          # software e l'orologio senza audio.
          bin\x64\Release\EditorTests.exe --gtest_also_run_disabled_tests --gtest_filter=*GeneraVideoDimostrativi*
          foreach ($f in 'demo_mpeg2_gpu.mkv', 'demo_mpeg4_software.mkv', 'demo_solo_audio.wav') {
            $p = Start-Process bin\x64\Release\EditorVideo.exe -ArgumentList '--smoke-test', "`"$env:TEMP\EditorVideoDemo\$f`"" `
                   -PassThru -RedirectStandardOutput play.txt -RedirectStandardError play-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$f : EditorVideo non si è chiuso entro 60 secondi" }
            Get-Content play.txt, play-err.txt
            if ($p.ExitCode -ne 0) { throw "$f : riproduzione non riuscita (codice $($p.ExitCode))" }
          }

      - name: Prova dell'esportazione
        shell: pwsh
        run: |
          # Taglia dai file dimostrativi un tratto e poi tre tratti uniti (ogni IN viene agganciato al fotogramma
          # chiave) e controlla i file creati.
          $demo = "$env:TEMP\EditorVideoDemo"
          $prove = @(
            @('demo_mpeg2_gpu.mkv', 'taglio_video.mkv', '2.5', '6.3'),
            @('demo_mpeg2_gpu.mkv', 'tratti_video.mkv', '1.2', '2.6', '4.0', '5.5', '8.0', '9.0'),
            @('demo_solo_audio.wav', 'tratti_audio.wav', '1.2', '3.5', '6', '7')
          )
          foreach ($t in $prove) {
            $argomenti = @('--export-test', "`"$demo\$($t[0])`"", "`"$demo\$($t[1])`"") + $t[2..($t.Count - 1)]
            $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru -ArgumentList $argomenti `
                   -RedirectStandardOutput export.txt -RedirectStandardError export-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$($t[1]) : esportazione bloccata" }
            Get-Content export.txt, export-err.txt
            if ($p.ExitCode -ne 0) { throw "$($t[1]) : esportazione non riuscita (codice $($p.ExitCode))" }
          }

      - name: Prova dell'unione di più file
        shell: pwsh
        run: |
          # Due file compatibili si uniscono (codice 0); un file con un codec diverso viene rifiutato (codice 4).
          $demo = "$env:TEMP\EditorVideoDemo"
          $prove = @(
            @{ atteso = 0; file = @('demo_mpeg2_gpu.mkv', 'demo_mpeg2_gpu.mkv') },
            @{ atteso = 4; file = @('demo_mpeg2_gpu.mkv', 'demo_mpeg4_software.mkv') }
          )
          foreach ($prova in $prove) {
            $argomenti = @('--join-test', "`"$demo\unione.mkv`"") + ($prova.file | ForEach-Object { "`"$demo\$_`"" })
            $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru -ArgumentList $argomenti `
                   -RedirectStandardOutput join.txt -RedirectStandardError join-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "unione bloccata" }
            Get-Content join.txt, join-err.txt
            if ($p.ExitCode -ne $prova.atteso) { throw "unione di $($prova.file -join ' + '): codice $($p.ExitCode) invece di $($prova.atteso)" }
          }

      - name: Prova del montaggio
        shell: pwsh
        run: |
          # Quattro pezzi in ordine sparso (lo stesso file più volte): durata e ordine controllati fotogramma per
          # fotogramma all'inizio di ogni pezzo. Un montaggio con un file di codec diverso viene rifiutato (codice 4).
          $demo = "$env:TEMP\EditorVideoDemo"
          $v = "`"$demo\demo_mpeg2_gpu.mkv`""
          $prove = @(
            @{ atteso = 0; pezzi = @($v, '6.0', '7.0', $v, '1.0', '2.52', $v, '4.3', '4.92', $v, '8.0', '9.0') },
            @{ atteso = 4; pezzi = @($v, '6.0', '7.0', "`"$demo\demo_mpeg4_software.mkv`"", '0', '1') }
          )
          foreach ($prova in $prove) {
            $argomenti = @('--sequence-test', "`"$demo\montaggio.mkv`"") + $prova.pezzi
            $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru -ArgumentList $argomenti `
                   -RedirectStandardOutput montaggio.txt -RedirectStandardError montaggio-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "montaggio bloccato" }
            Get-Content montaggio.txt, montaggio-err.txt
            if ($p.ExitCode -ne $prova.atteso) { throw "montaggio: codice $($p.ExitCode) invece di $($prova.atteso)" }
          }

      - name: Prova dell'audio
        shell: pwsh
        run: |
          # Audio tolto da due tratti (silenzio al posto dei campioni) e audio sostituito da un file solo audio
          # spostato di mezzo secondo; un WAV in un MP4 viene rifiutato (codice 4).
          $demo = "$env:TEMP\EditorVideoDemo"
          $v = "`"$demo\demo_mpeg2_gpu.mkv`""
          $a = "`"$demo\demo_solo_audio.wav`""
          $prove = @(
            @{ atteso = 0; argomenti = @("`"$demo\audio_muto.mkv`"", $v, 'mute', '2', '3.5', 'mute', '6', '7') },
            @{ atteso = 0; argomenti = @("`"$demo\audio_sostituito.mkv`"", $v, 'replace', $a, '0.5', 'mute', '4', '5') },
            @{ atteso = 4; argomenti = @("`"$demo\audio_rifiutato.mp4`"", $v, 'replace', $a, '0') }
          )
          foreach ($prova in $prove) {
            $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru -ArgumentList (@('--audio-test') + $prova.argomenti) `
                   -RedirectStandardOutput audio.txt -RedirectStandardError audio-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "prova dell'audio bloccata" }
            Get-Content audio.txt, audio-err.txt
            if ($p.ExitCode -ne $prova.atteso) { throw "audio: codice $($p.ExitCode) invece di $($prova.atteso)" }
          }

      - name: Prova del progetto
        shell: pwsh
        run: |
          # Salva, riapre, sposta la cartella, esporta; file mancante, versione sconosciuta e file rovinato.
          $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru `
                 -ArgumentList '--project-test', "`"$env:TEMP\EditorVideoDemo\demo_mpeg2_gpu.mkv`"" `
                 -RedirectStandardOutput progetto.txt -RedirectStandardError progetto-err.txt
          $null = $p.Handle  # necessario per leggere ExitCode
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "prova del progetto bloccata" }
          Get-Content progetto.txt, progetto-err.txt
          if ($p.ExitCode -ne 0) { throw "progetto: codice $($p.ExitCode)" }

      - name: Prova delle miniature
        shell: pwsh
        run: |
          # Una miniatura per fotogramma chiave dai file dimostrativi (il file solo audio non ne ha).
          $demo = "$env:TEMP\EditorVideoDemo"
          $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru `
                 -ArgumentList '--thumbnail-test', "`"$demo\demo_mpeg2_gpu.mkv`"", "`"$demo\demo_mpeg4_software.mkv`"", "`"$demo\demo_solo_audio.wav`"" `
                 -RedirectStandardOutput miniature.txt -RedirectStandardError miniature-err.txt
          $null = $p.Handle  # necessario per leggere ExitCode
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "prova delle miniature bloccata" }
          Get-Content miniature.txt, miniature-err.txt
          if ($p.ExitCode -ne 0) { throw "miniature: codice $($p.ExitCode)" }
