name: Build

on:
  push:
    branches: [main]
  pull_request:

# Un push nuovo sullo stesso ramo (o la stessa pull request) annulla l'esecuzione superata: altrimenti si accumulano in
# coda e ognuna rifà tutto.
concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025-vs2026
    env:
      # Fuori dalla cartella del repository ma senza ".." nel percorso: actions/cache non accetta percorsi
      # relativi (con "..\vcpkg-cache" il salvataggio della cache falliva e ogni CI ricompilava tutto). Il contesto
      # "runner" qui non si può usare: i percorsi completi si impostano nel primo passo, da RUNNER_WORKSPACE.
      VCPKG_ROOT_NAME: vcpkg
      VCPKG_CACHE_NAME: vcpkg-cache
      # In CI compiliamo solo Release: il triplet "release" evita di costruire anche le librerie Debug.
      VCPKG_TRIPLET: x64-windows-release
      # Commit di vcpkg (script e strumento) usato dalla CI. È fisso perché gli hash dei pacchetti dipendono anche da
      # vcpkg stesso: con l'ultima versione a ogni esecuzione la cache non serviva più e Qt e FFmpeg si ricompilavano
      # ogni volta. Le versioni dei pacchetti restano quelle di "builtin-baseline" in vcpkg.json. Deve essere almeno
      # 8995e218 (2026-10-06): prima vcpkg.targets perdeva /p:VcpkgTriplet e l'installazione falliva.
      VCPKG_COMMIT: 469a0504e4a6ebf6173d1c0f51a7fa34c382fd43
    steps:
      - uses: actions/checkout@v4

      - name: Percorsi di vcpkg
        shell: pwsh
        run: |
          # RUNNER_WORKSPACE è la cartella che contiene il repository (es. D:\a\EditorVideo): assoluta, senza "..".
          "VCPKG_ROOT=$env:RUNNER_WORKSPACE\$env:VCPKG_ROOT_NAME" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_WORKSPACE\$env:VCPKG_CACHE_NAME" >> $env:GITHUB_ENV

      - name: Installa vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout --quiet $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Ripristina la cache di vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Una chiave nuova a ogni esecuzione (una cache non si può sovrascrivere): si riparte dalla più recente con
          # lo stesso commit di vcpkg e, se sono stati compilati pacchetti nuovi, se ne salva una aggiornata.
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Contenuto della cache
        id: before
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:VCPKG_DEFAULT_BINARY_CACHE" -Recurse -File)
          $mb = [math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)
          Write-Output "Cache di vcpkg ripristinata: $($files.Count) pacchetti, $mb MB"
          "count=$($files.Count)" >> $env:GITHUB_OUTPUT

      - name: Scarica prima i sorgenti GNU usati da vcpkg
        shell: pwsh
        run: |
          # vcpkg (pacchetto vcpkg-make, usato per compilare FFmpeg) scarica automake da ftpmirror.gnu.org, che dal
          # server della build automatica a volte non risponde (curl error 35, errore SSL) e fa fallire tutto. Lo si
          # scarica prima da più mirror, nella cartella dei download di vcpkg con il nome che vcpkg si aspetta: vcpkg
          # lo trova lì e ne controlla lo SHA512. Se nessun mirror risponde non si ferma niente: ci riprova vcpkg.
          # (Al commit di vcpkg in VCPKG_COMMIT è l'unico file preso dai server GNU per i nostri pacchetti.)
          $downloads = Join-Path $env:VCPKG_ROOT 'downloads'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $files = @('automake/automake-1.17.tar.gz')
          $mirrors = @('https://ftp.gnu.org/gnu/', 'https://mirrors.kernel.org/gnu/', 'https://ftpmirror.gnu.org/gnu/',
                       'https://www.mirrorservice.org/sites/ftp.gnu.org/gnu/')
          foreach ($file in $files) {
            $target = Join-Path $downloads (Split-Path $file -Leaf)
            if (Test-Path $target) { continue }
            $done = $false
            foreach ($mirror in $mirrors) {
              for ($try = 1; $try -le 3 -and -not $done; $try++) {
                try {
                  Invoke-WebRequest -Uri ($mirror + $file) -OutFile "$target.part" -TimeoutSec 120
                  Move-Item -Force "$target.part" $target
                  $done = $true
                  Write-Output "Scaricato $file da $mirror"
                } catch {
                  Write-Output "Non riuscito ($mirror, tentativo $try): $($_.Exception.Message)"
                  Start-Sleep -Seconds (2 * $try)
                }
              }
              if ($done) { break }
            }
            if (-not $done) {
              Remove-Item -Force "$target.part" -ErrorAction SilentlyContinue
              Write-Output "::warning::$file non scaricato da nessun mirror: ci riprova vcpkg"
            }
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Compila (Release x64)
        shell: pwsh
        run: msbuild EditorVideo.slnx /m /nologo /p:Configuration=Release /p:Platform=x64 /p:VcpkgTriplet=$env:VCPKG_TRIPLET

      - name: Pacchetti nuovi nella cache
        id: after
        if: always()
        shell: pwsh
        run: |
          $count = @(Get-ChildItem "$env:VCPKG_DEFAULT_BINARY_CACHE" -Recurse -File).Count
          Write-Output "Pacchetti nella cache: $count (prima della compilazione: ${{ steps.before.outputs.count }})"
          "changed=$(if ($count -ne [int]'${{ steps.before.outputs.count }}') { 'si' } else { 'no' })" >> $env:GITHUB_OUTPUT

      - name: Salva la cache di vcpkg
        if: always() && steps.after.outputs.changed == 'si'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Test
        shell: pwsh
        run: bin\x64\Release\EditorTests.exe

      # Le prove che seguono avviano EditorVideo.exe con ci\run-editorvideo.ps1: aspetta la fine, mostra l'output e
      # controlla il codice di uscita.
      - name: Avvio dell'applicazione
        shell: pwsh
        run: '& ci\run-editorvideo.ps1 -Name avvio -Arguments ''--smoke-test'''

      - name: Prova della riproduzione
        shell: pwsh
        run: |
          # Genera tre file di prova da 10 secondi e li riproduce per 2 secondi ciascuno.
          # Sul server di solito non ci sono GPU né scheda audio: si verificano anche la decodifica
          # software e l'orologio senza audio.
          bin\x64\Release\EditorTests.exe --gtest_also_run_disabled_tests --gtest_filter=*GeneraVideoDimostrativi*
          foreach ($f in 'demo_mpeg2_gpu.mkv', 'demo_mpeg4_software.mkv', 'demo_solo_audio.wav') {
            & ci\run-editorvideo.ps1 -Name $f -Arguments '--smoke-test', "`"$env:TEMP\EditorVideoDemo\$f`""
          }

      - name: Prova dell'esportazione
        shell: pwsh
        run: |
          # Taglia dai file dimostrativi un tratto e poi tre tratti uniti e controlla i file creati.
          $demo = "$env:TEMP\EditorVideoDemo"
          $prove = @(
            @('demo_mpeg2_gpu.mkv', 'taglio_video.mkv', '2.5', '6.3'),
            @('demo_mpeg2_gpu.mkv', 'tratti_video.mkv', '1.2', '2.6', '4.0', '5.5', '8.0', '9.0'),
            @('demo_solo_audio.wav', 'tratti_audio.wav', '1.2', '3.5', '6', '7')
          )
          foreach ($t in $prove) {
            $argomenti = @('--export-test', "`"$demo\$($t[0])`"", "`"$demo\$($t[1])`"") + $t[2..($t.Count - 1)]
            & ci\run-editorvideo.ps1 -Name "esportazione $($t[1])" -Arguments $argomenti
          }

      - name: Prova dell'unione di più file
        shell: pwsh
        run: |
          # Due file compatibili si uniscono (codice 0); un file con un codec diverso viene rifiutato (codice 4).
          $demo = "$env:TEMP\EditorVideoDemo"
          $prove = @(
            @{ atteso = 0; file = @('demo_mpeg2_gpu.mkv', 'demo_mpeg2_gpu.mkv') },
            @{ atteso = 4; file = @('demo_mpeg2_gpu.mkv', 'demo_mpeg4_software.mkv') }
          )
          foreach ($prova in $prove) {
            $argomenti = @('--join-test', "`"$demo\unione.mkv`"") + ($prova.file | ForEach-Object { "`"$demo\$_`"" })
            & ci\run-editorvideo.ps1 -Name "unione di $($prova.file -join ' + ')" -Arguments $argomenti -Expected $prova.atteso
          }

      - name: Prova del montaggio
        shell: pwsh
        run: |
          # Quattro pezzi in ordine sparso (lo stesso file più volte): durata e ordine controllati fotogramma per
          # fotogramma all'inizio di ogni pezzo. Un montaggio con un file di codec diverso viene rifiutato (codice 4).
          # Con due spazi vuoti: l'MPEG-2 non si sa ricodificare, quindi niente nero, gli spazi si chiudono (codice 0).
          $demo = "$env:TEMP\EditorVideoDemo"
          $v = "`"$demo\demo_mpeg2_gpu.mkv`""
          $prove = @(
            @{ atteso = 0; pezzi = @($v, '6.0', '7.0', $v, '1.0', '2.52', $v, '4.3', '4.92', $v, '8.0', '9.0') },
            @{ atteso = 4; pezzi = @($v, '6.0', '7.0', "`"$demo\demo_mpeg4_software.mkv`"", '0', '1') },
            @{ atteso = 0; pezzi = @('spazio:0.5', $v, '6.0', '7.0', 'spazio:1.2', $v, '1.0', '2.52') }
          )
          foreach ($prova in $prove) {
            $argomenti = @('--sequence-test', "`"$demo\montaggio.mkv`"") + $prova.pezzi
            & ci\run-editorvideo.ps1 -Name montaggio -Arguments $argomenti -Expected $prova.atteso
          }

      - name: Prova dell'audio
        shell: pwsh
        run: |
          # Audio tolto da due tratti (silenzio al posto dei campioni) e audio sostituito da un file solo audio
          # spostato di mezzo secondo; un WAV in un MP4 viene rifiutato (codice 4).
          $demo = "$env:TEMP\EditorVideoDemo"
          $v = "`"$demo\demo_mpeg2_gpu.mkv`""
          $a = "`"$demo\demo_solo_audio.wav`""
          $prove = @(
            @{ atteso = 0; argomenti = @("`"$demo\audio_muto.mkv`"", $v, 'mute', '2', '3.5', 'mute', '6', '7') },
            @{ atteso = 0; argomenti = @("`"$demo\audio_sostituito.mkv`"", $v, 'replace', $a, '0.5', 'mute', '4', '5') },
            @{ atteso = 4; argomenti = @("`"$demo\audio_rifiutato.mp4`"", $v, 'replace', $a, '0') }
          )
          foreach ($prova in $prove) {
            & ci\run-editorvideo.ps1 -Name audio -Arguments (@('--audio-test') + $prova.argomenti) -Expected $prova.atteso
          }

      - name: Prova del progetto
        shell: pwsh
        run: |
          # Salva, riapre, sposta la cartella, esporta; file mancante, versione sconosciuta e file rovinato.
          & ci\run-editorvideo.ps1 -Name progetto -Arguments '--project-test', "`"$env:TEMP\EditorVideoDemo\demo_mpeg2_gpu.mkv`""

      - name: Prova delle miniature
        shell: pwsh
        run: |
          # Una miniatura per fotogramma chiave dai file dimostrativi (il file solo audio non ne ha).
          $demo = "$env:TEMP\EditorVideoDemo"
          & ci\run-editorvideo.ps1 -Name miniature -Arguments '--thumbnail-test', "`"$demo\demo_mpeg2_gpu.mkv`"", "`"$demo\demo_mpeg4_software.mkv`"", "`"$demo\demo_solo_audio.wav`""

      - name: Prova dei pannelli
        shell: pwsh
        run: |
          # Con la finestra vera: la linea del tempo staccata e riagganciata 5 volte per ogni modo (doppio clic sul titolo
          # di Windows, lasciata nella metà bassa, menu), ogni volta in basso, a tutta larghezza e alta abbastanza.
          & ci\run-editorvideo.ps1 -Name pannelli -Arguments '--dock-test'

      - name: Prova delle scritte
        shell: pwsh
        run: |
          # Le scritte disegnate con Qt (font, colore, contorno, ombra, sfondo, opacità, posizione) controllate a pixel.
          & ci\run-editorvideo.ps1 -Name scritte -Arguments '--text-test'

      - name: Prova dell'elenco delle transizioni
        shell: pwsh
        run: |
          # L'elenco delle transizioni (voci, miniature, scelta) e le due schede del blocco in alto a sinistra.
          & ci\run-editorvideo.ps1 -Name transizioni -Arguments '--transition-test'

      - name: Prova della scheda Gruppi
        shell: pwsh
        run: |
          # L'elenco dei gruppi (nodi, oggetti, nodi chiusi) e le tre schede del blocco in alto a sinistra.
          & ci\run-editorvideo.ps1 -Name gruppi -Arguments '--group-test'

      - name: Prova della finestra Esporta
        shell: pwsh
        run: |
          # La finestra "Esporta" con un riepilogo inventato: avviso di sovrascrittura, destinazioni che non vanno e scelte
          # (encoder, qualità, audio) che arrivano alle opzioni dell'esportazione.
          & ci\run-editorvideo.ps1 -Name 'finestra Esporta' -Arguments '--export-panel-test'

      - name: Prova dell'esportazione dalla finestra
        shell: pwsh
        run: |
          # Il progetto dimostrativo (due pezzi, audio tolto in un tratto) aperto nella finestra vera ed esportato come
          # dal comando Esporta, senza le finestre di dialogo. Codice 3 se l'esportazione si blocca.
          $demo = "$env:TEMP\EditorVideoDemo"
          & ci\run-editorvideo.ps1 -Name 'esportazione dalla finestra' -TimeoutSeconds 420 `
            -Arguments '--project-export-test', "`"$demo\demo_progetto.evproj`"", "`"$demo\progetto_esportato.mkv`""
