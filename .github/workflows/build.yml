name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-cache
      # In CI compiliamo solo Release: il triplet "release" evita di costruire anche le librerie Debug.
      VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@v4

      - name: Installa vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Ripristina la cache di vcpkg
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - uses: microsoft/setup-msbuild@v2

      - name: Compila (Release x64)
        shell: pwsh
        run: msbuild EditorVideo.slnx /m /nologo /p:Configuration=Release /p:Platform=x64 /p:VcpkgTriplet=$env:VCPKG_TRIPLET

      - name: Salva la cache di vcpkg
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Test
        shell: pwsh
        run: bin\x64\Release\EditorTests.exe

      - name: Avvio dell'applicazione
        shell: pwsh
        run: |
          $p = Start-Process bin\x64\Release\EditorVideo.exe -ArgumentList '--smoke-test' -PassThru `
                 -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          $null = $p.Handle  # necessario per leggere ExitCode
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "EditorVideo non si è chiuso entro 60 secondi" }
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "EditorVideo è uscito con codice $($p.ExitCode)" }

      - name: Prova della riproduzione
        shell: pwsh
        run: |
          # Genera tre file di prova da 10 secondi e li riproduce per 2 secondi ciascuno.
          # Sul server di solito non ci sono GPU né scheda audio: si verificano anche la decodifica
          # software e l'orologio senza audio.
          bin\x64\Release\EditorTests.exe --gtest_also_run_disabled_tests --gtest_filter=*GeneraVideoDimostrativi*
          foreach ($f in 'demo_mpeg2_gpu.mkv', 'demo_mpeg4_software.mkv', 'demo_solo_audio.wav') {
            $p = Start-Process bin\x64\Release\EditorVideo.exe -ArgumentList '--smoke-test', "`"$env:TEMP\EditorVideoDemo\$f`"" `
                   -PassThru -RedirectStandardOutput play.txt -RedirectStandardError play-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$f : EditorVideo non si è chiuso entro 60 secondi" }
            Get-Content play.txt, play-err.txt
            if ($p.ExitCode -ne 0) { throw "$f : riproduzione non riuscita (codice $($p.ExitCode))" }
          }

      - name: Prova dell'esportazione
        shell: pwsh
        run: |
          # Taglia un segmento dai file dimostrativi (IN viene agganciato al fotogramma chiave) e controlla il risultato.
          $demo = "$env:TEMP\EditorVideoDemo"
          foreach ($t in @(@('demo_mpeg2_gpu.mkv', 'taglio_video.mkv', '2.5', '6.3'), @('demo_solo_audio.wav', 'taglio_audio.wav', '1.2', '3.5'))) {
            $p = Start-Process bin\x64\Release\EditorVideo.exe -PassThru `
                   -ArgumentList '--export-test', "`"$demo\$($t[0])`"", "`"$demo\$($t[1])`"", $t[2], $t[3] `
                   -RedirectStandardOutput export.txt -RedirectStandardError export-err.txt
            $null = $p.Handle  # necessario per leggere ExitCode
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "$($t[0]) : esportazione bloccata" }
            Get-Content export.txt, export-err.txt
            if ($p.ExitCode -ne 0) { throw "$($t[0]) : esportazione non riuscita (codice $($p.ExitCode))" }
          }
